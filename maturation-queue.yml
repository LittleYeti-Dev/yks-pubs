# YKS Paper Maturation Queue
#
# The daily wp-daily-orchestrator workflow reads this file every day at 04:30 ET,
# takes the FIRST entry (head of the queue), fires wp-level-up + wp-pubs-site-mirror
# for that paper, Telegram-pings you start + done, and pops the entry on success.
#
# If `enabled: false` is set on an entry, it's skipped (operator can pause without
# losing the entry).
#
# Add new entries by appending to the `queue:` list. Reordering is welcome.
# Operator can edit this file at any time; the orchestrator reads the live state
# from origin/main each morning.
#
# Currently seeded with the 4 v1.1 errata already shipped to yks-pubs/papers/ —
# these need the pubs-site mirror step (PDF copy to yks-web + frontmatter update).
# Once those are processed, the queue can hold Round-3 promotions, capstone-shipping,
# preprint→peer-reviewed transitions, etc.

