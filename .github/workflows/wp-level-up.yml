name: wp-level-up — mature a paper to its next level (operator-gated release)

# Generic paper-promotion workflow. Picks up where compose-v11-errata.yml left off,
# parametric on transition_type so the same backbone handles every level-up shape:
#
#   errata-bump          v1.x       -> v1.x+1     base + addendum -> PDF
#   preprint-promote     v0.1-seed  -> v1-preprint base markdown -> PDF
#   major-revision       v1.x       -> v2-preprint base markdown -> PDF
#   peer-review-promote  v1.x       -> v1.x       same content, peer-review badge in metadata
#
# Every transition follows the same backbone:
#   1. Clone source repo(s); resolve source markdown path.
#   2. Compose combined markdown (with addendum if errata-bump; base alone otherwise).
#   3. Compile to PDF via pandoc + xelatex.
#   4. Stamp cover + footer + XMP via yks-web/scripts/stamp-paper-pdf.py.
#   5. Push to yks-pubs/papers/<slug>-<target_label>.pdf using MESH_TOKEN.
#   6. Stop after the controlled PDF push. A separate, explicit operator-approved
#      release intent is required before zenodo-deposit-release.yml can create a
#      GitHub Release and trigger Zenodo DOI minting.
#
# Adopted 2026-05-17, supersedes compose-v11-errata.yml (which becomes a legacy alias
# for the errata-bump transition).
#
# Pubs-site selection UX: today the operator picks a slug from
# https://nonsequitur.tech/white-papers/ (or yks-pubs/papers/) and fires this
# workflow via Actions UI workflow_dispatch. Future integration with the Yeti UI
# dashboard (yks-execution#171 + the §12 errata-drift surface) will add a "Level Up"
# button per paper that fires this workflow with the slug pre-filled.

on:
  workflow_dispatch:
    inputs:
      paper_id:
        description: 'PAPYRUS paper ID (for example PAP-SJCE-001)'
        required: true
        type: string
      slug:
        description: 'Paper slug (e.g. hgc3ae2-at-the-degraded-edge). Must match the canonical slug used on the pubs site.'
        required: true
        type: string
      transition:
        description: 'Maturity transition to apply'
        required: true
        type: choice
        options:
          - errata-bump
          - preprint-promote
          - major-revision
          - peer-review-promote
      source_repo:
        description: 'PAPYRUS source repository; other surfaces use reconciliation, not publishing authority'
        required: true
        type: string
        default: 'papyrus-factory-recurring'
      source_path:
        description: 'Path to source markdown inside source_repo (this becomes the body of the new PDF)'
        required: true
        type: string
      addendum_repo:
        description: 'Repo containing the addendum (errata-bump only; leave default otherwise)'
        required: false
        type: string
        default: 'papyrus-factory-recurring'
      addendum_path:
        description: 'Path to addendum markdown (errata-bump only; leave blank for other transitions)'
        required: false
        type: string
      current_version:
        description: 'Current published version (e.g., v1-preprint; used by WP Standards gate to locate prior PDF)'
        required: false
        type: string
        default: 'v1-preprint'
      target_label:
        description: 'Target version label for the output PDF (e.g. v1-1-preprint, v1-preprint, v2-preprint)'
        required: true
        type: string
      title_suffix:
        description: 'Suffix to append to the paper title (e.g. " (v1.1 errata)" — optional)'
        required: false
        type: string
        default: ''
      tracker_issue:
        description: 'Tracking issue (cross-repo OK, e.g. YKS-Spine-Binder#376) — optional'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'If true, compose + stamp but skip push (artifact uploaded for inspection)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Serialize all level-up pushes to main so parallel-fired runs don't race on git push.
concurrency:
  # Per-slug grouping so different papers can run in parallel.
  # cancel-in-progress: false — within the same slug, a new run waits for the prior to finish
  # (no double-compose), but different slugs proceed concurrently.
  group: wp-level-up-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  level-up:
    name: ${{ inputs.transition }} ${{ inputs.slug }} -> ${{ inputs.target_label }}
    # The only repository-scoped Omen runner is offline and no Praeceptor
    # runner is registered. Use a reproducible hosted image until the replacement
    # runner is connected and separately qualified.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout yks-pubs (MESH_TOKEN for controlled archive writes)
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MESH_TOKEN }}

      - name: Validate inputs + check current pubs state
        env:
          PAPER_ID: ${{ inputs.paper_id }}
          SLUG: ${{ inputs.slug }}
          TRANSITION: ${{ inputs.transition }}
          TARGET_LABEL: ${{ inputs.target_label }}
          SOURCE_PATH: ${{ inputs.source_path }}
          ADDENDUM_PATH: ${{ inputs.addendum_path }}
        run: |
          set -euo pipefail
          echo "=== wp-level-up dispatch ==="
          echo "  paper_id:     $PAPER_ID"
          echo "  slug:         $SLUG"
          echo "  transition:   $TRANSITION"
          echo "  target_label: $TARGET_LABEL"
          echo "  addendum:     ${ADDENDUM_PATH:-(none)}"
          echo
          if ! [[ "$PAPER_ID" =~ ^[A-Z0-9]+(-[A-Z0-9]+)+$ ]]; then
            echo "FATAL: invalid PAPYRUS paper_id: $PAPER_ID"
            exit 1
          fi
          if ! [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "FATAL: invalid canonical slug: $SLUG"
            exit 1
          fi
          if ! [[ "$TARGET_LABEL" =~ ^v[0-9]+([.-][0-9]+)*(-[a-z0-9]+)*$ ]]; then
            echo "FATAL: invalid target version label: $TARGET_LABEL"
            exit 1
          fi
          case "$SOURCE_PATH" in
            /*|../*|*/../*|*/..) echo "FATAL: source_path must be a bounded relative path"; exit 1 ;;
          esac
          case "$ADDENDUM_PATH" in
            /*|../*|*/../*|*/..) echo "FATAL: addendum_path must be a bounded relative path"; exit 1 ;;
          esac
          if [ "${{ inputs.source_repo }}" != "papyrus-factory-recurring" ]; then
            echo "FATAL: source_repo must be papyrus-factory-recurring for a new version build"
            echo "Existing publications from another surface must use wp-reconcile-existing-publication.yml"
            exit 1
          fi
          if [ "${{ inputs.addendum_repo }}" != "papyrus-factory-recurring" ]; then
            echo "FATAL: addendum_repo must be papyrus-factory-recurring"
            exit 1
          fi
          if [ "$TRANSITION" = "errata-bump" ] && [ -z "$ADDENDUM_PATH" ]; then
            echo "FATAL: errata-bump requires addendum_path"; exit 1
          fi
          if [ "$TRANSITION" != "errata-bump" ] && [ -n "$ADDENDUM_PATH" ]; then
            echo "WARNING: addendum_path supplied for non-errata transition; ignoring"
          fi
          # Show current pubs state for this slug
          echo "=== Current papers/${SLUG}-*.pdf on yks-pubs ==="
          ls -1 "papers/" | grep "^${SLUG}-" || echo "  (no existing PDFs for this slug)"
          TARGET="papers/${SLUG}-${TARGET_LABEL}.pdf"
          if [ -f "$TARGET" ]; then
            echo "::error::target file $TARGET already exists — refusing to overwrite an identified publication artifact"
            echo "Use a new version label, or run the governed reconciliation/back-rev process."
            exit 1
          fi

      - name: Clone source repos (yks-web for stamper + source_repo for manuscript + yks-canon for grounding)
        env:
          MESH_TOKEN: ${{ secrets.MESH_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ADDENDUM_REPO: ${{ inputs.addendum_repo }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${MESH_TOKEN}@github.com/LittleYeti-Dev/yks1.0-web.git" \
            "$RUNNER_TEMP/yks-web"
          # v2 (2026-05-17): yks-canon is now a mandatory checkout. The Edna substantive-expansion
          # dispatch builder inlines CANON.md as "Foundational canon"; without canon present, the
          # prior `||` fallback wrote a literal placeholder string into canon-foundations.md while
          # the dispatch's verifiable-assertion §45 claimed the canon was present. Edna refused all
          # 10 dispatches on 2026-05-17 for this reason. Hard-fail-on-absent is the contract now.
          git clone --depth 1 \
            "https://x-access-token:${MESH_TOKEN}@github.com/LittleYeti-Dev/yks1.0-canon.git" \
            "$RUNNER_TEMP/yks-canon"
          git clone --depth 1 \
            "https://x-access-token:${MESH_TOKEN}@github.com/LittleYeti-Dev/${SOURCE_REPO}.git" \
            "$RUNNER_TEMP/source"
          if [ "$SOURCE_REPO" != "$ADDENDUM_REPO" ]; then
            git clone --depth 1 \
              "https://x-access-token:${MESH_TOKEN}@github.com/LittleYeti-Dev/${ADDENDUM_REPO}.git" \
              "$RUNNER_TEMP/addendum"
          else
            ln -s "$RUNNER_TEMP/source" "$RUNNER_TEMP/addendum"
          fi

      - name: Install pandoc + xelatex + python deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra \
            texlive-latex-recommended texlive-latex-extra lmodern poppler-utils
          python3 -m pip install --break-system-packages --quiet reportlab pypdf pyyaml

      - name: WP Standards v1.1 compliance gate (2026-05-17 — major-revision MUST pass; minor bumps verify but warn)
        id: standards
        env:
          TRANSITION: ${{ inputs.transition }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SLUG: ${{ inputs.slug }}
          CURRENT_VERSION: ${{ inputs.current_version }}
          TARGET_LABEL: ${{ inputs.target_label }}
        run: |
          set -euo pipefail
          # Find the current PDF (use prior major's preprint by default)
          PAPER_PDF=""
          for cand in "papers/${SLUG}-v1-2-preprint.pdf" "papers/${SLUG}-v1-1-preprint.pdf" "papers/${SLUG}-v1-preprint.pdf"; do
            if [ -f "$cand" ]; then PAPER_PDF="$cand"; break; fi
          done
          if [ -z "$PAPER_PDF" ]; then
            echo "no prior PDF found; first-time promotion — gate not applicable"
            echo "gate_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          PAGES=$(pdfinfo "$PAPER_PDF" | awk '/^Pages:/ {print $2}')
          echo "current PDF: $PAPER_PDF ($PAGES pages)"
          echo "pages=$PAGES" >> $GITHUB_OUTPUT
          # §1 — page floor (25)
          GATE_FAILED=false
          DEFICITS=""
          if [ "$PAGES" -lt 25 ]; then
            GATE_FAILED=true
            DEFICITS="${DEFICITS}1,"
            echo "§1 page floor FAILED: $PAGES < 25"
          fi
          # §6 — major-revision triggers full gate; minor transitions are warn-only
          if [ "$TRANSITION" = "major-revision" ] && [ "$GATE_FAILED" = "true" ]; then
            echo "MAJOR REVISION + STANDARDS DEFICIT — staging Edna substantive-expansion dispatch"
            echo "gate_failed=true" >> $GITHUB_OUTPUT
            echo "deficits=${DEFICITS%,}" >> $GITHUB_OUTPUT
          elif [ "$GATE_FAILED" = "true" ]; then
            echo "NON-MAJOR + STANDARDS DEFICIT — warning only, proceeding"
            echo "gate_failed=false" >> $GITHUB_OUTPUT
            echo "warned_deficits=${DEFICITS%,}" >> $GITHUB_OUTPUT
          else
            echo "STANDARDS PASS"
            echo "gate_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build + stage Edna substantive-expansion dispatch (when major-revision fails standards)
        if: ${{ steps.standards.outputs.gate_failed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.MESH_TOKEN }}
          SLUG: ${{ inputs.slug }}
          CURRENT_VERSION: ${{ inputs.current_version }}
          TARGET_VERSION: ${{ inputs.target_label }}
          TRANSITION: ${{ inputs.transition }}
          PAGES: ${{ steps.standards.outputs.pages }}
          DEFICITS: ${{ steps.standards.outputs.deficits }}
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pip install --break-system-packages pyyaml --quiet
          # Build doctrine corpus + canon + standards snapshots.
          # v2 (2026-05-17): corpus build is now strict — any failure halts the workflow rather
          # than emitting "(corpus build had warnings)" and silently shipping a half-built corpus.
          python3 .github/scripts/build-doctrine-corpus.py \
            --web-content "$RUNNER_TEMP/yks-web/sites/nsq-pub/content/pubs/white-papers" \
            --output /tmp/doctrine-corpus.md \
            --exclude-slug "$SLUG"
          # v2 self-check (AC-2): round-trip stability. Build the corpus a second time with
          # identical inputs and require byte-identical output. The 2026-05-17 batch defect
          # surfaced as title↔slug scramble that Edna believed varied per-invocation; this gate
          # makes the determinism contract explicit and machine-checkable.
          python3 .github/scripts/build-doctrine-corpus.py \
            --web-content "$RUNNER_TEMP/yks-web/sites/nsq-pub/content/pubs/white-papers" \
            --output /tmp/doctrine-corpus.recheck.md \
            --exclude-slug "$SLUG"
          if ! diff -q /tmp/doctrine-corpus.md /tmp/doctrine-corpus.recheck.md >/dev/null; then
            echo "::error::build-doctrine-corpus.py is non-deterministic across two invocations with identical inputs — halting (AC-2 contract violated)."
            diff /tmp/doctrine-corpus.md /tmp/doctrine-corpus.recheck.md | head -40
            exit 1
          fi
          # Canon snapshot — v2 (2026-05-17): hard-fail on missing canon. The prior `||` fallback
          # wrote a literal placeholder string into canon-foundations.md, which the dispatch
          # builder then inlined under the heading "Foundational canon" while the dispatch's
          # own verifiable-assertion §45 claimed the canon was present. That mismatch is what
          # Edna refused 10/10 of the 2026-05-17 expansion batch on. AC-1 contract: canon present
          # and non-empty, or the workflow halts here before staging anything.
          CANON_PATH="$RUNNER_TEMP/yks-canon/CANON.md"
          if [ ! -s "$CANON_PATH" ]; then
            echo "::error::CANON.md missing or empty at $CANON_PATH — refusing to compose dispatch with placeholder canon (Edna 2026-05-17 root cause)."
            exit 1
          fi
          {
            echo "# yks-canon CANON.md"; echo
            cat "$CANON_PATH"
          } > /tmp/canon-foundations.md
          # WP Standards — read the current governed file from the exact Canon
          # checkout already bound to this run. The legacy proposed-file API path
          # was removed and caused the dispatch builder to fail.
          WP_STANDARD="$RUNNER_TEMP/yks-canon/governance/governance-wp-publishing-standards-v1.1.md"
          test -s "$WP_STANDARD" || { echo "::error::current WP standard missing: $WP_STANDARD"; exit 1; }
          cp "$WP_STANDARD" /tmp/wp-standards.md
          # Locate current paper PDF + md
          PAPER_PDF=""
          for cand in "papers/${SLUG}-v1-2-preprint.pdf" "papers/${SLUG}-v1-1-preprint.pdf" "papers/${SLUG}-v1-preprint.pdf"; do
            if [ -f "$cand" ]; then PAPER_PDF="$cand"; break; fi
          done
          # v2 (2026-05-17) AC-3: Standard-4 substrate resolution. For major-revision and
          # peer-review-promote, the publishing-quality basis must be the v1.0-PUBLISHED
          # artifact, not the spine-binder intake draft (which Standard 4 §265 explicitly
          # rejects as "NOT the publishing-quality basis"). Of Standard 4's three options:
          #   A — yks-spine-binder/published/<slug>/<slug>-v1.0.md  (tree does not exist 2026-05-17)
          #   B — text extracted from yks-pubs/papers/<slug>-v1-preprint.pdf via pdftotext  (chosen)
          #   C — Stackrat compose path reproduced  (under-specified; deferred)
          # errata-bump and preprint-promote keep the intake substrate — only the major-revision
          # / peer-review-promote transitions need the v1.0-published basis.
          if [ "$TRANSITION" = "major-revision" ] || [ "$TRANSITION" = "peer-review-promote" ]; then
            if [ -z "$PAPER_PDF" ] || [ ! -f "$PAPER_PDF" ]; then
              echo "::error::Standard-4 substrate resolution failed: transition=$TRANSITION requires a v1.0-published PDF basis at papers/${SLUG}-v1*-preprint.pdf, none found. Refusing to compose a substantive-expansion dispatch against the intake draft (Standard 4 §265 prohibition)."
              exit 1
            fi
            PAPER_MD="/tmp/${SLUG}-published-basis.md"
            pdftotext -layout "$PAPER_PDF" - \
              | sed -e '1s/^/---\ntitle: "(extracted from v1.0-published PDF)"\nslug: '"${SLUG}"'\nsubstrate: pdf-extract\n---\n\n/' \
              > "$PAPER_MD"
            echo "Standard-4 substrate: extracted $(wc -c < "$PAPER_MD") chars from $PAPER_PDF -> $PAPER_MD"
          else
            PAPER_MD="$RUNNER_TEMP/source/$SOURCE_PATH"
          fi
          DISPATCH_NAME="dispatch-edna-substantive-expansion-${SLUG}-$(date -u +%Y-%m-%d).md"
          DISPATCH_PATH="/tmp/$DISPATCH_NAME"
          python3 .github/scripts/build-standards-compliance-dispatch.py             --slug "$SLUG"             --current-version "$CURRENT_VERSION"             --target-version "$TARGET_VERSION"             --transition "$TRANSITION"             --pages "$PAGES"             --pages-required 25             --paper-pdf "$PAPER_PDF"             --paper-md "$PAPER_MD"             --doctrine-corpus /tmp/doctrine-corpus.md             --canon-foundations /tmp/canon-foundations.md             --wp-standards /tmp/wp-standards.md             --deficits "$DEFICITS"             --output "$DISPATCH_PATH"
          # Stage to yks-ops-hub/execute/lz/ via Contents API
          B64=$(base64 -w 0 "$DISPATCH_PATH")
          export B64
          python3 <<'PY' > /tmp/dispatch-pl.json
          import json, os
          slug = os.environ["SLUG"]
          tr = os.environ["TRANSITION"]
          tv = os.environ["TARGET_VERSION"]
          pages = os.environ["PAGES"]
          payload = {
            "message": f"edna: WP Standards v1.1 gate failed for {slug} ({tr} -> {tv}) - substantive-expansion dispatch auto-staged. {pages} pages, gate requires >=25. Cowork-Edna Tier-B work owed.",
            "content": os.environ["B64"],
            "branch": "main",
            "committer": {"name": "wp-standards-gate-bot", "email": "wp-standards-gate-bot@yks.local"}
          }
          print(json.dumps(payload))
          PY
          HTTP=$(curl -s -o /tmp/dispatch-resp.json -w "%{http_code}"             -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json"             --data-binary @/tmp/dispatch-pl.json             "https://api.github.com/repos/LittleYeti-Dev/yks-ops-hub/contents/execute/lz/$DISPATCH_NAME")
          echo "Edna dispatch staged: HTTP $HTTP"

      - name: HALT — major revision blocked by standards gate
        if: ${{ steps.standards.outputs.gate_failed == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUG: ${{ inputs.slug }}
          TRANSITION: ${{ inputs.transition }}
          TARGET: ${{ inputs.target_label }}
          PAGES: ${{ steps.standards.outputs.pages }}
          DEFICITS: ${{ steps.standards.outputs.deficits }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            MSG="HALT wp-level-up: $SLUG $TRANSITION -> $TARGET blocked by WP Standards v1.1 gate (pages=$PAGES, deficits=$DEFICITS). Edna substantive-expansion dispatch auto-staged in yks-ops-hub/execute/lz/. Cowork-Edna Tier-B work owed before re-fire."
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"               -d "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}" -o /dev/null
          fi
          echo "::error::WP Standards v1.1 gate blocked $TRANSITION for $SLUG — Edna dispatch staged. Halting workflow."
          exit 1

      - name: Archive prior-version PDF(s) BEFORE compose (AC-6, 2026-05-17 TM amendment 3eac3f41)
        env:
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRACKER: ${{ inputs.tracker_issue }}
        run: |
          set -euo pipefail
          # AC-6 (TM amendment 3eac3f41): copy every existing prior-version PDF for this
          # slug into the in-repo archive tree at papers-archive/<slug>/<version-label>.pdf
          # BEFORE the new compose step runs. Hard-fail on any archive-write failure (no
          # silent fallback — same discipline as AC-1 canon hard-fail).
          #
          # Archive target chosen: (b) yks-pubs/papers-archive/<slug>/<version-label>.pdf.
          # Rationale: (a) yks-papers-archive repo requires new deploy-key + lz-sync wiring
          # — too heavy for a single-purpose feature; (c) yks-canon/papers-archive contradicts
          # canon's role (governance docs, not artifact storage; flagged in the dispatch
          # itself). (b) is the pragmatic same-repo option, deterministic path layout
          # supports back-rev <slug> <version> lookups, and the upgrade path to (a) later is
          # clean because the data layout is identical, just a different repo.
          # ADR draft: yks-build/handoffs/2026-05-17/clive-wp-level-up-v2-ac6-archive-adr-draft.md
          # Bootstrap baseline preserved at tag refs/tags/archive/pre-clive-v2-2026-05-17.
          # Tracker: yks-pubs#6 (AC-6 issue, separate from AC-1..AC-4 at #5 closed).
          PRIORS=$(ls papers/${SLUG}-v*.pdf 2>/dev/null || true)
          if [ -z "$PRIORS" ]; then
            echo "AC-6: no prior-version PDFs for $SLUG — first-time promote; archive step is a no-op."
            exit 0
          fi
          mkdir -p "papers-archive/${SLUG}"
          ARCHIVED=0
          NEW_WRITES=0
          for prior in $PRIORS; do
            base=$(basename "$prior")
            vlabel=${base#${SLUG}-}
            vlabel=${vlabel%.pdf}
            target="papers-archive/${SLUG}/${vlabel}.pdf"
            if [ -f "$target" ] && cmp -s "$prior" "$target"; then
              echo "AC-6: $target already at-content for $prior — no-op."
              ARCHIVED=$((ARCHIVED+1))
              continue
            fi
            cp "$prior" "$target"
            [ -f "$target" ] || { echo "::error::AC-6: archive write failed for $prior -> $target"; exit 1; }
            echo "AC-6: archived $prior -> $target ($(wc -c < "$target") bytes)"
            ARCHIVED=$((ARCHIVED+1))
            NEW_WRITES=$((NEW_WRITES+1))
          done
          echo "AC-6: $ARCHIVED prior PDF(s) reconciled, $NEW_WRITES new archive write(s)."
          if [ "$DRY_RUN" = "true" ]; then
            echo "AC-6: dry_run=true — archive staged locally, not committed."
            exit 0
          fi
          if [ "$NEW_WRITES" -eq 0 ]; then
            echo "AC-6: nothing new to commit (all priors already archived at-content)."
            exit 0
          fi
          # Separate commit BEFORE compose for clean audit trail.
          git config user.name  "wp-level-up-bot"
          git config user.email "wp-level-up-bot@yks.local"
          git add papers-archive/
          MSG="wp-level-up: archive ${NEW_WRITES} prior-version PDF(s) for ${SLUG} BEFORE compose (AC-6)"
          if [ -n "$TRACKER" ]; then
            MSG="$MSG  (tracker: $TRACKER)"
          fi
          git commit -m "$MSG"
          # Race-safe push (same pattern as the post-compose commit step).
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "AC-6 archive push succeeded on attempt $attempt"; break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::AC-6: archive push failed after 3 attempts — refusing to proceed to compose"
              exit 1
            fi
            echo "AC-6 push rejected (attempt $attempt) — fetch + rebase + retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

      - name: Compose source markdown (transition-aware)
        env:
          TRANSITION: ${{ inputs.transition }}
          SOURCE_PATH: ${{ inputs.source_path }}
          ADDENDUM_PATH: ${{ inputs.addendum_path }}
          TITLE_SUFFIX: ${{ inputs.title_suffix }}
          TARGET_LABEL: ${{ inputs.target_label }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          BASE_FILE="$RUNNER_TEMP/source/$SOURCE_PATH"
          test -f "$BASE_FILE" || { echo "FATAL: source markdown not found at $BASE_FILE"; exit 1; }
          echo "source size: $(wc -c < $BASE_FILE)"
          if [ "$TRANSITION" = "errata-bump" ]; then
            ADDENDUM_FILE="$RUNNER_TEMP/addendum/$ADDENDUM_PATH"
            test -f "$ADDENDUM_FILE" || { echo "FATAL: addendum not found at $ADDENDUM_FILE"; exit 1; }
            echo "addendum size: $(wc -c < $ADDENDUM_FILE)"
          fi

          python3 <<'PY'
          import os, re, pathlib, yaml
          tr = os.environ["TRANSITION"]
          base = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source" / os.environ["SOURCE_PATH"]
          base_text = base.read_text(encoding="utf-8")
          title_suffix = os.environ.get("TITLE_SUFFIX", "")
          target_label = os.environ["TARGET_LABEL"]

          # Parse base frontmatter
          m = re.match(r"---\s*\n(.*?)\n---\s*\n(.*)", base_text, re.DOTALL)
          if m:
              base_fm = yaml.safe_load(m.group(1)) or {}
              base_body = m.group(2)
          else:
              base_fm = {}
              base_body = base_text

          # 2026-05-17 (Yeti) — ADDITIVE-ONLY UPLIFT DOCTRINE.
          # The spine-binder intake frontmatter is editorially thin (14 fields). The yks-web
          # frontmatter is the published-paper Hugo frontmatter (37+ fields) including abstract,
          # published_date, logo_path, keywords, topics — all of which the stamp-paper-pdf.py
          # cover renderer reads. Merge web frontmatter BEFORE building new_fm so the cover
          # restores every reader-visible block from v1.0.
          web_fm = {}
          slug = os.environ.get("SLUG", "")
          if slug:
              web_md_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "yks-web" / "sites" / "nsq-pub" / "content" / "pubs" / "white-papers" / f"{slug}.md"
              if web_md_path.exists():
                  wt = web_md_path.read_text(encoding="utf-8")
                  wm = re.match(r"---\s*\n(.*?)\n---\s*\n", wt, re.DOTALL)
                  if wm:
                      web_fm = yaml.safe_load(wm.group(1)) or {}
                      print(f"merged yks-web frontmatter: {len(web_fm)} fields from {slug}.md")

          # Cover-display fields from yks-web overwrite spine-binder intake on these keys.
          # If any of these is missing from BOTH sources, halt — bare cover would violate additive doctrine.
          COVER_FIELDS = ("abstract", "date", "published_date", "logo_path",
                          "keywords", "topics", "orcid", "affiliation",
                          "series", "license")
          merged = dict(base_fm)
          for k in COVER_FIELDS:
              if k in web_fm:
                  merged[k] = web_fm[k]
          # Verify-before-relying — cover-content superset enforcement
          REQUIRED_COVER = ("abstract", "published_date", "logo_path", "affiliation")
          missing = [k for k in REQUIRED_COVER if k not in merged or not merged[k]]
          if missing:
              raise SystemExit(f"FATAL: additive-doctrine violation — required cover field(s) missing from merged frontmatter: {missing}. yks-web has {len(web_fm)} fields, spine-binder has {len(base_fm)} fields. Cover render would drop content vs prior version. Halt rather than ship.")

          # Build new frontmatter from MERGED — preserve author/title/canonical_url/abstract/dates,
          # bump version, append suffix
          new_fm = dict(merged)
          old_title = new_fm.get("title", "Untitled")
          if title_suffix:
              new_fm["title"] = old_title + title_suffix
          # Derive a version field from target_label.
          # target_label format: "v<MAJOR>-<MINOR>-<channel>" (e.g., "v1-2-preprint", "v1-1-preprint")
          # Want: "<MAJOR>.<MINOR>-<channel>" (e.g., "1.2-preprint")
          # ONLY replace dashes in the MAJOR-MINOR portion, not the trailing -<channel> suffix.
          _parts = target_label.lstrip("v").split("-")
          if len(_parts) >= 3:
              # join all but last by ".", then add "-<channel>"
              version_str = ".".join(_parts[:-1]) + "-" + _parts[-1]
          else:
              version_str = target_label.lstrip("v").replace("-", ".")
          new_fm["version"] = version_str
          # Drop prior DOI; the new Zenodo deposit gets its own
          new_fm.pop("doi", None)
          new_fm.pop("zenodo_doi", None)
          new_fm["target_version"] = target_label
          new_fm["date_of_writing"] = os.environ.get("GITHUB_RUN_STARTED_AT", "")[:10] or "2026-05-17"

          # Compose body based on transition
          if tr == "errata-bump":
              adden = pathlib.Path(os.environ["RUNNER_TEMP"]) / "addendum" / os.environ["ADDENDUM_PATH"]
              adden_text = adden.read_text(encoding="utf-8")
              # Strip addendum's own frontmatter
              m2 = re.match(r"---\s*\n.*?\n---\s*\n(.*)", adden_text, re.DOTALL)
              adden_body = m2.group(1) if m2 else adden_text
              body = (
                  base_body.rstrip()
                  + "\n\n---\n\n# Appendix — v1.1 Errata Addendum\n\n"
                  + "_Added " + new_fm["date_of_writing"] + " per Round-2 EDITORIAL-STAMP HOLD-substance verdict. "
                  + "The v1.0-preprint remains canonical at its original DOI; this v1.1 supplements with the corrections below._\n\n"
                  + adden_body.rstrip()
              )
          elif tr == "peer-review-promote":
              # No content change; just add a peer-review badge to frontmatter
              new_fm["peer_reviewed"] = True
              new_fm["peer_review_date"] = new_fm["date_of_writing"]
              body = base_body.rstrip()
          else:
              # preprint-promote, major-revision: use base markdown directly
              body = base_body.rstrip()

          combined = (
              "---\n"
              + yaml.safe_dump(new_fm, allow_unicode=True, sort_keys=False)
              + "---\n\n"
              + body + "\n"
          )
          pathlib.Path("combined.md").write_text(combined, encoding="utf-8")
          pathlib.Path("frontmatter.yaml").write_text(
              yaml.safe_dump(new_fm, allow_unicode=True, sort_keys=False), encoding="utf-8")
          print(f"combined.md: {len(combined)} chars  frontmatter.yaml emitted")
          PY

      - name: Compile combined markdown to raw manuscript PDF (pandoc + xelatex)
        run: |
          set -euo pipefail
          pandoc combined.md \
            --pdf-engine=xelatex \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -V geometry:margin=1in \
            -V linkcolor=blue \
            --toc \
            -o "raw-manuscript.pdf"
          echo "raw manuscript size: $(stat -c%s raw-manuscript.pdf) bytes"

      - name: Run stamp-paper-pdf.py for cover/footer/XMP
        env:
          SLUG: ${{ inputs.slug }}
          TARGET_LABEL: ${{ inputs.target_label }}
        run: |
          set -euo pipefail
          mkdir -p papers
          OUT="papers/${SLUG}-${TARGET_LABEL}.pdf"
          python3 "$RUNNER_TEMP/yks-web/scripts/stamp-paper-pdf.py" \
            --frontmatter frontmatter.yaml \
            --in raw-manuscript.pdf \
            --out "$OUT"
          echo "stamped PDF: $OUT  size: $(stat -c%s $OUT) bytes  sha256: $(sha256sum $OUT | awk '{print $1}')"

      - name: Emit source-bound PAPYRUS build receipt
        id: build_receipt
        env:
          PAPER_ID: ${{ inputs.paper_id }}
          SLUG: ${{ inputs.slug }}
          TRANSITION: ${{ inputs.transition }}
          TARGET_LABEL: ${{ inputs.target_label }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_PATH: ${{ inputs.source_path }}
          ADDENDUM_REPO: ${{ inputs.addendum_repo }}
          ADDENDUM_PATH: ${{ inputs.addendum_path }}
          TRACKER: ${{ inputs.tracker_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          RECEIPT="records/builds/${PAPER_ID}/${TARGET_LABEL}/${GITHUB_RUN_ID}.json"
          mkdir -p "$(dirname "$RECEIPT")"
          SOURCE_FILE="$RUNNER_TEMP/source/$SOURCE_PATH"
          SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)
          CANON_COMMIT=$(git -C "$RUNNER_TEMP/yks-canon" rev-parse HEAD)
          WEBSITE_COMMIT=$(git -C "$RUNNER_TEMP/yks-web" rev-parse HEAD)
          PDF="papers/${SLUG}-${TARGET_LABEL}.pdf"
          TOTAL_PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          ARGS=(
            --paper-id "$PAPER_ID"
            --slug "$SLUG"
            --transition "$TRANSITION"
            --target-version "$TARGET_LABEL"
            --source-repo "$SOURCE_REPO"
            --source-path "$SOURCE_PATH"
            --source-file "$SOURCE_FILE"
            --source-commit "$SOURCE_COMMIT"
            --canon-commit "$CANON_COMMIT"
            --website-metadata-commit "$WEBSITE_COMMIT"
            --pdf-path "$PDF"
            --total-pages "$TOTAL_PAGES"
            --workflow-run-url "$RUN_URL"
            --built-at "$BUILT_AT"
            --output "$RECEIPT"
          )
          if [ -n "$ADDENDUM_PATH" ]; then
            ADDENDUM_COMMIT=$(git -C "$RUNNER_TEMP/addendum" rev-parse HEAD)
            ARGS+=(
              --addendum-repo "$ADDENDUM_REPO"
              --addendum-path "$ADDENDUM_PATH"
              --addendum-file "$RUNNER_TEMP/addendum/$ADDENDUM_PATH"
              --addendum-commit "$ADDENDUM_COMMIT"
            )
          fi
          if [ -n "$TRACKER" ]; then
            ARGS+=(--tracker "$TRACKER")
          fi
          python3 .github/scripts/create-build-receipt.py "${ARGS[@]}"
          echo "path=$RECEIPT" >> "$GITHUB_OUTPUT"

      - name: Upload stamped PDF as workflow artifact (visible regardless of dry_run)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.slug }}-${{ inputs.target_label }}
          path: |
            papers/${{ inputs.slug }}-${{ inputs.target_label }}.pdf
            ${{ steps.build_receipt.outputs.path }}
          retention-days: 14

      - name: Commit + push controlled PDF to yks-pubs/papers/ (DOI mint remains gated)
        if: ${{ inputs.dry_run != true }}
        env:
          SLUG: ${{ inputs.slug }}
          TARGET_LABEL: ${{ inputs.target_label }}
          TRANSITION: ${{ inputs.transition }}
          TRACKER: ${{ inputs.tracker_issue }}
          BUILD_RECEIPT: ${{ steps.build_receipt.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "wp-level-up-bot"
          git config user.email "wp-level-up-bot@yks.local"
          git add "papers/${SLUG}-${TARGET_LABEL}.pdf" "$BUILD_RECEIPT"
          MSG="wp-level-up (${TRANSITION}): ${SLUG} -> ${TARGET_LABEL}"
          if [ -n "$TRACKER" ]; then
            MSG="$MSG  (tracker: $TRACKER)"
          fi
          git commit -m "$MSG"

          # Race-safe push with rebase retry — concurrency group serializes most
          # cases, but stale-clone after a queued run lands a sibling commit can
          # still reject. Retry up to 3 times.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "push succeeded on attempt $attempt"; break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "push failed after 3 attempts"; exit 1
            fi
            echo "push rejected (attempt $attempt) — fetch + rebase + retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        env:
          SLUG: ${{ inputs.slug }}
          TARGET_LABEL: ${{ inputs.target_label }}
        run: |
          echo "=== DRY-RUN COMPLETE ==="
          echo "Stamped PDF composed at papers/${SLUG}-${TARGET_LABEL}.pdf"
          echo "Push to main was SKIPPED (dry_run=true)."
          echo "No GitHub Release or Zenodo DOI action was requested."
          echo "Inspect the artifact to verify content + cover page before firing with dry_run=false."
