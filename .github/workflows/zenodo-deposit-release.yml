name: zenodo-deposit — operator-gated GitHub Release and Zenodo mint

# Creates one GitHub Release for one exact PDF only after an explicit operator
# release intent passes validation. The release is the Zenodo auto-mint trigger,
# so ordinary PDF pushes MUST NOT start this workflow.
#
# Adopted 2026-05-13 per Yeti directive — closes the yks-pubs automation gap
# surfaced when the 9 Lane-2 PDFs landed without firing the deposit pipeline.
# L2 reference: yks-ops-hub#207 (forked from Klaus #199 surface #6).

on:
  workflow_dispatch:
    inputs:
      release_intent_path:
        description: 'Tracked JSON under release-intents/ authorizing one exact PDF and DOI mint'
        required: true
        type: string
      confirm_mint:
        description: 'I confirm this creates a GitHub Release and may irreversibly mint a Zenodo DOI'
        required: true
        default: false
        type: boolean

permissions:
  contents: write     # for gh release create
  pull-requests: read

concurrency:
  group: zenodo-deposit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fire-releases:
    name: Create GitHub Release per new PDF (Zenodo mint trigger)
    # Release intent validation and GitHub Release creation need no privileged
    # self-hosted substrate. The repository-scoped Omen runner is offline.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed state
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate explicit operator release intent and bind exact PDF
        id: intent
        env:
          INTENT_PATH: ${{ inputs.release_intent_path }}
          CONFIRM_MINT: ${{ inputs.confirm_mint }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_MINT" != "true" ]; then
            echo "::error::confirm_mint is false — refusing to create a release or mint a DOI"
            exit 1
          fi
          case "$INTENT_PATH" in
            release-intents/*.json|release-intents/*/*.json) ;;
            *) echo "::error::release_intent_path must be a JSON file under release-intents/"; exit 1 ;;
          esac
          test -f "$INTENT_PATH" || { echo "::error::tracked release intent not found: $INTENT_PATH"; exit 1; }
          git ls-files --error-unmatch "$INTENT_PATH" >/dev/null
          python3 .github/scripts/validate-release-intent.py \
            --intent "$INTENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create one release for the approved PDF (idempotent on existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
          MESH_TOKEN: ${{ secrets.MESH_TOKEN }}
          PDFS: ${{ steps.intent.outputs.pdf_path }}
          OPERATOR_DECISION_REF: ${{ steps.intent.outputs.operator_decision_ref }}
          APPROVED_PDF_SHA256: ${{ steps.intent.outputs.pdf_sha256 }}
          PAPYRUS_RELEASE_GATE_REF: ${{ steps.intent.outputs.papyrus_release_gate_ref }}
          VALIDATION_RECEIPT_REF: ${{ steps.intent.outputs.validation_receipt_ref }}
          TEN_FIELD_PREFLIGHT_REF: ${{ steps.intent.outputs.ten_field_preflight_ref }}
          SOURCE_COMMIT: ${{ steps.intent.outputs.source_commit }}
          SOURCE_REPOSITORY: ${{ steps.intent.outputs.source_repository }}
          SOURCE_CUSTODY: ${{ steps.intent.outputs.source_custody }}
          SUBSTANTIVE_PAGES: ${{ steps.intent.outputs.substantive_page_count }}
          PEER_REVIEWED_SOURCES: ${{ steps.intent.outputs.verified_peer_reviewed_source_count }}
          POST_2024_SOURCES: ${{ steps.intent.outputs.verified_post_2024_primary_source_count }}
          OUTBOUND_CROSS_PAPER: ${{ steps.intent.outputs.outbound_cross_paper_reference_count }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os, sys, json, base64, subprocess, urllib.request, re

          MESH = os.environ.get('MESH_TOKEN', '')
          GH = os.environ['GH_TOKEN']
          PDFS = [p.strip() for p in os.environ.get('PDFS','').splitlines() if p.strip()]
          if not PDFS:
              print("[zenodo-deposit] No PDFs to release.")
              sys.exit(0)
          print(f"[zenodo-deposit] {len(PDFS)} PDF(s) in scope: {PDFS}")

          def gh_api(url, headers=None, method='GET', data=None, timeout=20):
              H = headers or {'Authorization': f'Bearer {GH}', 'Accept': 'application/vnd.github+json'}
              req = urllib.request.Request(url, method=method, data=data, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.load(r) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8','replace')[:300]

          def parse_pdf_name(path):
              # papers/<slug>-v<version>.pdf  →  (slug, version)
              base = os.path.basename(path).replace('.pdf','')
              m = re.match(r'^(.+)-v(.+)$', base)
              if not m:
                  return None, None
              return m.group(1), m.group(2)

          def fetch_frontmatter(slug, mesh_token):
              # Pull title + abstract from yks-web. Requires MESH_TOKEN with yks-web read.
              if not mesh_token:
                  return {}
              url = f"https://api.github.com/repos/LittleYeti-Dev/yks1.0-web/contents/sites/nsq-pub/content/pubs/white-papers/{slug}.md?ref=main"
              code, d = gh_api(url, headers={'Authorization': f'Bearer {mesh_token}', 'Accept': 'application/vnd.github+json'})
              if code != 200:
                  print(f"  [{slug}] frontmatter fetch failed (code {code})")
                  return {}
              c = base64.b64decode(d['content']).decode('utf-8','replace')
              parts = c.split('---', 2)
              if len(parts) < 2:
                  return {}
              fm_text = parts[1]
              # Extract title (single-line) + abstract (multiline block)
              title = ''
              abstract = ''
              in_abstract = False
              for line in fm_text.split('\n'):
                  if line.startswith('title:'):
                      title = line.split(':',1)[1].strip().strip('"').strip("'")
                  elif line.startswith('abstract:'):
                      in_abstract = True
                      continue
                  elif in_abstract:
                      if line.startswith(' ') or line.startswith('\t') or not line.strip():
                          if line.strip():
                              abstract += line.strip() + ' '
                      else:
                          in_abstract = False
              return {'title': title, 'abstract': abstract.strip()}

          repo = os.environ.get('GITHUB_REPOSITORY','')
          owner, repo_name = repo.split('/',1)

          # Get existing tags (idempotency)
          code, tags = gh_api(f"https://api.github.com/repos/{owner}/{repo_name}/tags?per_page=100")
          existing_tags = {t['name'] for t in tags} if code == 200 and isinstance(tags, list) else set()
          print(f"[zenodo-deposit] {len(existing_tags)} existing tags")

          released = 0
          skipped = 0
          for pdf_path in PDFS:
              slug, version = parse_pdf_name(pdf_path)
              if not slug:
                  print(f"  [skip] cannot parse: {pdf_path}")
                  continue
              tag = f"{slug}-v{version}"
              if tag in existing_tags:
                  print(f"  [{tag}] tag exists — skip (idempotent)")
                  skipped += 1
                  continue

              # Pull frontmatter for title + abstract
              meta = fetch_frontmatter(slug, MESH)
              title = meta.get('title') or slug
              abstract = meta.get('abstract') or ''

              # Release body
              body_lines = [
                  f"## {title}",
                  "",
                  f"**Version:** {version}",
                  f"**Slug:** `{slug}`",
                  f"**Live page:** https://nonsequitur.tech/white-papers/{slug}/",
                  f"**PDF:** [{os.path.basename(pdf_path)}](https://github.com/{owner}/{repo_name}/releases/download/{tag}/{os.path.basename(pdf_path)})",
                  f"**Approved SHA-256:** `{os.environ['APPROVED_PDF_SHA256']}`",
                  f"**Operator release decision:** {os.environ['OPERATOR_DECISION_REF']}",
                  f"**PAPYRUS release gate:** {os.environ['PAPYRUS_RELEASE_GATE_REF']}",
                  f"**Validation receipt:** {os.environ['VALIDATION_RECEIPT_REF']}",
                  f"**Ten-field preflight:** {os.environ['TEN_FIELD_PREFLIGHT_REF']}",
                  f"**Source:** `{os.environ['SOURCE_REPOSITORY']}@{os.environ['SOURCE_COMMIT']}` / `{os.environ['SOURCE_CUSTODY']}`",
                  f"**Research floor:** {os.environ['SUBSTANTIVE_PAGES']} substantive pages; {os.environ['PEER_REVIEWED_SOURCES']} verified peer-reviewed sources; {os.environ['POST_2024_SOURCES']} post-2024 primary sources",
                  f"**Cross-paper gate:** {os.environ['OUTBOUND_CROSS_PAPER']} outbound reference(s), chain-of-evidence PASS",
                  "",
              ]
              if abstract:
                  body_lines += ["### Abstract", "", abstract, ""]
              body_lines += [
                  "---",
                  "*Released by `zenodo-deposit` workflow. Zenodo DOI auto-mints from this Release via the configured Zenodo-GitHub integration.*",
              ]
              body = '\n'.join(body_lines)

              # Use gh CLI for Release create (handles asset upload cleanly)
              print(f"  [{tag}] creating release...")
              result = subprocess.run(
                  ['gh', 'release', 'create', tag, pdf_path,
                   '--title', f"{title} (v{version})",
                   '--notes', body],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  print(f"  [{tag}] ✓ {result.stdout.strip()}")
                  released += 1
              else:
                  print(f"  [{tag}] ✗ {result.stderr.strip()[:300]}")

          print(f"\n[zenodo-deposit] SUMMARY: {released} released, {skipped} skipped (already tagged)")
          PYEOF
