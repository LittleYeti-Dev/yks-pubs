name: wp-daily-orchestrator — fire one WP maturation each morning

# Cron-triggered daily at 04:30 ET (08:30 UTC standard; 1-hour DST drift acceptable).
# Reads yks-pubs/maturation-queue.yml, takes the first enabled entry, fires either:
#   - wp-level-up (compose + push PDF; transitions: errata-bump, preprint-promote, major-revision, peer-review-promote)
#   - wp-pubs-site-mirror (just the reader-facing mirror; transition: pubs-mirror-only)
#   - wp-framework-uplift (backward-enrichment editorial cycle; transition: framework-uplift — produces v1.x addendum DRAFT, operator must fire errata-bump to mint DOI)
# Pings Telegram start + done. On success, pops the entry from the queue and commits
# the update. On failure, leaves the entry in place and Telegram-pings the failure.

on:
  schedule:
    - cron: '30 8 * * *'     # 04:30 ET standard / 05:30 ET DST
  workflow_dispatch: {}      # manual fire for testing

permissions:
  contents: write
  actions: write

concurrency:
  group: wp-daily-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Read queue, fire next maturation, update queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout yks-pubs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MESH_TOKEN }}

      - name: Resolve next queue entry
        id: queue
        run: |
          set -euo pipefail
          if [ ! -f maturation-queue.yml ]; then
            echo "no maturation-queue.yml; nothing to orchestrate today"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/orchestrator-pop-head.py > /tmp/head.json
          if [ ! -s /tmp/head.json ]; then
            echo "queue empty or no enabled entries; orchestrator idles today"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Emit each field as a GitHub Actions output
          python3 -c '
          import json
          d = json.load(open("/tmp/head.json"))
          for k, v in d.items():
              print(f"{k}={v}")
          ' >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          cat /tmp/head.json

      - name: Telegram ping — start
        if: ${{ steps.queue.outputs.skip != 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUG: ${{ steps.queue.outputs.slug }}
          TRANSITION: ${{ steps.queue.outputs.transition }}
          TARGET: ${{ steps.queue.outputs.target_label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          MSG="wp-daily-orchestrator: starting $SLUG $TRANSITION -> $TARGET. Run: $RUN_URL"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}" -o /dev/null -w "start ping HTTP %{http_code}\n"

      - name: Dispatch wp-level-up, wp-pubs-site-mirror, OR wp-framework-uplift based on transition
        if: ${{ steps.queue.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.MESH_TOKEN }}
          TRANSITION: ${{ steps.queue.outputs.transition }}
          SLUG: ${{ steps.queue.outputs.slug }}
          TARGET: ${{ steps.queue.outputs.target_label }}
          SOURCE_REPO: ${{ steps.queue.outputs.source_repo }}
          SOURCE_PATH: ${{ steps.queue.outputs.source_path }}
          ADDENDUM_PATH: ${{ steps.queue.outputs.addendum_path }}
          TITLE_SUFFIX: ${{ steps.queue.outputs.title_suffix }}
          TRACKER: ${{ steps.queue.outputs.tracker }}
          DOI: ${{ steps.queue.outputs.doi }}
          CURRENT_VERSION: ${{ steps.queue.outputs.current_version }}
        run: |
          set -euo pipefail
          if [ "$TRANSITION" = "pubs-mirror-only" ]; then
            WF="wp-pubs-site-mirror.yml"
            INPUTS=$(python3 -c "import json; print(json.dumps({
              'slug': '$SLUG',
              'target_label': '$TARGET',
              'doi': '$DOI' if '$DOI' else 'pending'
            }))")
          elif [ "$TRANSITION" = "framework-uplift" ]; then
            # NEW 2026-05-17: Edna backward-enrichment editorial cycle.
            # Produces v1.x addendum DRAFT + future-study issues. STOPS BEFORE canon mint
            # — operator must manually fire wp-level-up (transition=errata-bump) to mint DOI.
            # Required queue fields: slug, current_version, target_label (target = the draft label).
            WF="wp-framework-uplift.yml"
            CUR="$CURRENT_VERSION"
            [ -z "$CUR" ] && CUR="v1-preprint"  # safe default
            INPUTS=$(python3 -c "import json; print(json.dumps({
              'slug': '$SLUG',
              'current_version': '$CUR',
              'target_version': '$TARGET'
            }))")
          else
            WF="wp-level-up.yml"
            INPUTS=$(python3 -c "import json; print(json.dumps({
              'slug': '$SLUG',
              'transition': '$TRANSITION',
              'source_repo': '$SOURCE_REPO' or 'YKS-Spine-Binder',
              'source_path': '$SOURCE_PATH',
              'addendum_repo': 'YKS-Spine-Binder',
              'addendum_path': '$ADDENDUM_PATH',
              'target_label': '$TARGET',
              'title_suffix': '$TITLE_SUFFIX',
              'tracker_issue': '$TRACKER',
              'dry_run': 'false'
            }))")
          fi
          echo "dispatching $WF with inputs: $INPUTS"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF}/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":$INPUTS}" \
            -w "  dispatch HTTP %{http_code}\n"

      - name: Pop the head entry from maturation-queue.yml
        if: ${{ steps.queue.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/orchestrator-pop-head.py --commit
          if git diff --quiet -- maturation-queue.yml; then
            echo "no queue mutation"
          else
            git config user.name "wp-daily-orchestrator-bot"
            git config user.email "wp-daily-orchestrator-bot@yks.local"
            git add maturation-queue.yml
            git commit -m "queue: pop ${{ steps.queue.outputs.slug }} ${{ steps.queue.outputs.target_label }} (orchestrator daily fire)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              [ "$attempt" -eq 3 ] && exit 1
              git fetch origin main && git rebase origin/main
              sleep $((attempt * 5))
            done
          fi

      - name: Telegram ping — idle (skip case)
        if: ${{ steps.queue.outputs.skip == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          MSG="wp-daily-orchestrator: queue empty or no enabled entries; idling today. Edit maturation-queue.yml to add the next paper."
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}" -o /dev/null

      - name: Telegram ping — dispatched (success path closes here; downstream workflow handles its own pings)
        if: ${{ success() && steps.queue.outputs.skip != 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUG: ${{ steps.queue.outputs.slug }}
          TRANSITION: ${{ steps.queue.outputs.transition }}
          TARGET: ${{ steps.queue.outputs.target_label }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          MSG="wp-daily-orchestrator: dispatched $SLUG $TRANSITION -> $TARGET. Follow-on workflow will Telegram-ping when done."
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}" -o /dev/null
